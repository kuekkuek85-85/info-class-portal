<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 380" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#171717"/>
    </marker>
  </defs>
  <rect width="240" height="380" fill="#fff"/>
  <text x="120" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#171717">뜨거워! 몸의 반사 반응</text>

  <!-- 불꽃과 뜨거운 물체 -->
  <path d="M21 77C8 64 27 54 25 42C40 54 44 64 36 78Z" fill="#fbbf24" stroke="#171717" stroke-width="2"/>
  <path d="M27 75C22 68 31 64 30 57C38 65 38 70 34 76Z" fill="#fb7185" stroke="#171717" stroke-width="1.5"/>
  <rect x="16" y="78" width="29" height="7" rx="3" fill="#fde68a" stroke="#171717" stroke-width="1.5"/>

  <!-- 간단한 캐릭터 -->
  <circle cx="76" cy="58" r="21" fill="#fde68a" stroke="#171717" stroke-width="2"/>
  <path d="M61 55Q76 34 91 54" fill="none" stroke="#171717" stroke-width="2"/>
  <circle cx="70" cy="59" r="1.8" fill="#171717"/><circle cx="82" cy="59" r="1.8" fill="#171717"/>
  <path d="M71 68Q76 72 81 68" fill="none" stroke="#171717" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M64 82Q76 77 88 82L93 125Q76 133 59 125Z" fill="#bbf7d0" stroke="#171717" stroke-width="2"/>
  <!-- 손을 열원에 댄 팔 -->
  <path d="M62 91L48 102L42 82" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="41" cy="81" r="4" fill="#fde68a" stroke="#171717" stroke-width="1.5"/>
  <!-- 반사로 뒤로 당기는 팔 -->
  <path d="M89 91L103 101L111 87" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="112" cy="85" r="4" fill="#fde68a" stroke="#171717" stroke-width="1.5"/>
  <path d="M68 126L65 151M83 126L87 151" fill="none" stroke="#171717" stroke-width="7" stroke-linecap="round"/>
  <path d="M60 152h11M82 152h11" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
  <text x="18" y="99" font-size="10" fill="#171717">뜨거운 불</text>

  <!-- 1 피부에서 뇌로 -->
  <circle cx="42" cy="81" r="9" fill="#bbf7d0" stroke="#171717" stroke-width="1.5"/>
  <text x="42" y="84.5" text-anchor="middle" font-size="10" font-weight="700" fill="#171717">1</text>
  <path d="M50 75Q57 48 70 48" fill="none" stroke="#171717" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="46" y="42" font-size="10" font-weight="700" fill="#171717">신호</text>
  <!-- 뇌 강조 -->
  <path d="M66 49Q64 42 70 40Q74 35 79 40Q85 37 88 43Q94 47 89 52Q84 56 78 53Q71 56 66 49Z" fill="#c4b5fd" stroke="#171717" stroke-width="1.5"/>
  <text x="77" y="49" text-anchor="middle" font-size="10" font-weight="700" fill="#171717">뇌</text>

  <!-- 2 뇌에서 팔 근육으로 -->
  <circle cx="94" cy="45" r="9" fill="#fde68a" stroke="#171717" stroke-width="1.5"/>
  <text x="94" y="48.5" text-anchor="middle" font-size="10" font-weight="700" fill="#171717">2</text>
  <path d="M89 53Q103 69 105 91" fill="none" stroke="#171717" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="101" y="68" font-size="10" font-weight="700" fill="#171717">명령</text>
  <circle cx="111" cy="85" r="9" fill="#c4b5fd" stroke="#171717" stroke-width="1.5"/>
  <text x="111" y="88.5" text-anchor="middle" font-size="10" font-weight="700" fill="#171717">3</text>
  <path d="M117 78l4 -6m-1 11h8m-11 1l5 6" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

  <!-- 설명 단계 -->
  <rect x="8" y="164" width="224" height="48" rx="9" fill="#ecfdf5" stroke="#171717" stroke-width="1.5"/>
  <circle cx="23" cy="188" r="10" fill="#bbf7d0" stroke="#171717" stroke-width="1.2"/>
  <text x="23" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">1</text>
  <text x="39" y="182" font-size="11" font-weight="700" fill="#171717">① 센서(입력)</text>
  <text x="39" y="199" font-size="10" fill="#171717">손이 뜨거움을 느낌</text>

  <rect x="8" y="218" width="224" height="48" rx="9" fill="#fffbeb" stroke="#171717" stroke-width="1.5"/>
  <circle cx="23" cy="242" r="10" fill="#fde68a" stroke="#171717" stroke-width="1.2"/>
  <text x="23" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">2</text>
  <text x="39" y="236" font-size="11" font-weight="700" fill="#171717">② 마이크로프로세서(처리)</text>
  <text x="39" y="253" font-size="10" fill="#171717">뇌가 '앗 뜨거!' 판단</text>

  <rect x="8" y="272" width="224" height="48" rx="9" fill="#f5f3ff" stroke="#171717" stroke-width="1.5"/>
  <circle cx="23" cy="296" r="10" fill="#c4b5fd" stroke="#171717" stroke-width="1.2"/>
  <text x="23" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">3</text>
  <text x="39" y="290" font-size="11" font-weight="700" fill="#171717">③ 액추에이터(출력)</text>
  <text x="39" y="307" font-size="10" fill="#171717">근육이 손을 뗌</text>

  <!-- 아래쪽 흐름 띠 -->
  <rect x="8" y="334" width="224" height="36" rx="10" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <rect x="15" y="341" width="59" height="22" rx="7" fill="#bbf7d0" stroke="#171717" stroke-width="1.2"/>
  <text x="44.5" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">입력</text>
  <text x="86" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#171717">→</text>
  <rect x="98" y="341" width="59" height="22" rx="7" fill="#fde68a" stroke="#171717" stroke-width="1.2"/>
  <text x="127.5" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">처리</text>
  <text x="169" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#171717">→</text>
  <rect x="181" y="341" width="43" height="22" rx="7" fill="#c4b5fd" stroke="#171717" stroke-width="1.2"/>
  <text x="202.5" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">출력</text>
</svg>
