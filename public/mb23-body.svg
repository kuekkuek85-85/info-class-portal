<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="120" y="22" text-anchor="middle" font-size="13" fill="#64748b">사람 몸으로 보면</text>

  <!-- ===== 사람 (왼쪽) ===== -->
  <!-- 머리 -->
  <circle cx="66" cy="78" r="30" fill="#fde68a" stroke="#171717" stroke-width="2"/>
  <!-- 뇌(머릿속 생각) -->
  <path d="M52 66 q-6 -8 2 -13 q4 -8 12 -4 q10 -4 12 5 q8 2 4 11 q3 9 -6 10 q-5 7 -13 2 q-9 3 -12 -6 q-6 -5 1 -12 z"
        fill="#fef3c7" stroke="#171717" stroke-width="1.6"/>
  <!-- 눈 -->
  <circle cx="57" cy="82" r="3.2" fill="#171717"/>
  <circle cx="75" cy="82" r="3.2" fill="#171717"/>
  <!-- 귀 -->
  <circle cx="36" cy="80" r="6" fill="#fde68a" stroke="#171717" stroke-width="2"/>

  <!-- 몸통 -->
  <rect x="44" y="110" width="44" height="78" rx="14" fill="#bbf7d0" stroke="#171717" stroke-width="2"/>
  <!-- 들어올린 오른팔(움직임) -->
  <path d="M88 124 q26 -6 30 -34" fill="none" stroke="#171717" stroke-width="7" stroke-linecap="round"/>
  <circle cx="120" cy="86" r="7" fill="#c7d2fe" stroke="#171717" stroke-width="2"/>
  <!-- 왼팔 -->
  <path d="M44 126 q-20 8 -22 34" fill="none" stroke="#171717" stroke-width="7" stroke-linecap="round"/>
  <!-- 다리 -->
  <path d="M56 188 l-6 44" fill="none" stroke="#171717" stroke-width="8" stroke-linecap="round"/>
  <path d="M76 188 l6 44" fill="none" stroke="#171717" stroke-width="8" stroke-linecap="round"/>

  <!-- ===== 라벨 (오른쪽) ===== -->
  <!-- 입력 = 센서 (눈·귀) -->
  <line x1="78" y1="82" x2="150" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g transform="translate(138 150)">
    <rect x="0" y="0" width="96" height="46" rx="9" fill="#bbf7d0" stroke="#171717" stroke-width="2"/>
    <text x="48" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#171717">입력 · 센서</text>
    <text x="48" y="34" text-anchor="middle" font-size="10" fill="#475569">눈·귀·피부로 감지</text>
  </g>

  <!-- 처리 = 뇌 -->
  <line x1="84" y1="66" x2="150" y2="96" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g transform="translate(138 86)">
    <rect x="0" y="0" width="96" height="46" rx="9" fill="#fde68a" stroke="#171717" stroke-width="2"/>
    <text x="48" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#171717">처리 · 뇌</text>
    <text x="48" y="34" text-anchor="middle" font-size="10" fill="#475569">생각하고 판단</text>
  </g>

  <!-- 출력 = 액추에이터 (손발·근육) -->
  <line x1="118" y1="90" x2="150" y2="224" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g transform="translate(138 224)">
    <rect x="0" y="0" width="96" height="46" rx="9" fill="#c7d2fe" stroke="#171717" stroke-width="2"/>
    <text x="48" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#171717">출력 · 손발</text>
    <text x="48" y="34" text-anchor="middle" font-size="10" fill="#475569">움직여서 반응</text>
  </g>

  <!-- 아래: 입력 → 처리 → 출력 흐름 -->
  <g transform="translate(0 300)">
    <rect x="18" y="0" width="60" height="26" rx="7" fill="#bbf7d0" stroke="#171717" stroke-width="1.6"/>
    <text x="48" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">입력</text>
    <text x="90" y="17" text-anchor="middle" font-size="14" fill="#64748b">→</text>
    <rect x="102" y="0" width="60" height="26" rx="7" fill="#fde68a" stroke="#171717" stroke-width="1.6"/>
    <text x="132" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">처리</text>
    <text x="174" y="17" text-anchor="middle" font-size="14" fill="#64748b">→</text>
    <rect x="186" y="0" width="48" height="26" rx="7" fill="#c7d2fe" stroke="#171717" stroke-width="1.6"/>
    <text x="210" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">출력</text>
  </g>
</svg>
