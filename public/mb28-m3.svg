<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 184" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <style>
    .poop{animation:fall3 3.4s ease-in infinite}
    @keyframes fall3{0%{transform:translateY(0);opacity:1}8%{transform:translateY(0);opacity:1}40%{transform:translateY(96px);opacity:1}50%{transform:translateY(120px);opacity:1}58%{transform:translateY(144px);opacity:0}100%{transform:translateY(144px);opacity:0}}
  </style>
  <rect x="6" y="6" width="132" height="132" rx="18" fill="#17171b"/>
  <g fill="#2a2a30"><circle cx="24" cy="24" r="7"/><circle cx="48" cy="24" r="7"/><circle cx="72" cy="24" r="7"/><circle cx="96" cy="24" r="7"/><circle cx="120" cy="24" r="7"/><circle cx="24" cy="48" r="7"/><circle cx="48" cy="48" r="7"/><circle cx="72" cy="48" r="7"/><circle cx="96" cy="48" r="7"/><circle cx="120" cy="48" r="7"/><circle cx="24" cy="72" r="7"/><circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="120" cy="72" r="7"/><circle cx="24" cy="96" r="7"/><circle cx="48" cy="96" r="7"/><circle cx="72" cy="96" r="7"/><circle cx="96" cy="96" r="7"/><circle cx="120" cy="96" r="7"/><circle cx="24" cy="120" r="7"/><circle cx="48" cy="120" r="7"/><circle cx="72" cy="120" r="7"/><circle cx="96" cy="120" r="7"/><circle cx="120" cy="120" r="7"/></g>
  <circle cx="48" cy="120" r="7" fill="#ff5a5a"/>
  <circle class="poop" cx="96" cy="24" r="7" fill="#b8860b"/>
  <text x="72" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#171717">똥 한 개 떨어뜨리기</text>
  <text x="72" y="177" text-anchor="middle" font-size="11" fill="#64748b">한 번 떨어지고 사라져요</text>
</svg>
