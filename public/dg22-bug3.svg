<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="140" y="22" text-anchor="middle" font-size="14" fill="#64748b">증상 — 똥이 너무 빨라 화면을 가득 채워요</text>
  <rect x="40" y="30" width="200" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 점수: 거의 안 오름 -->
  <text x="140" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#171717">Score: 1</text>

  <!-- 속도 선(모션) + 빽빽한 똥 여러 개 -->
  <g stroke="#c7a17a" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="64" y1="70" x2="64" y2="104"/>
    <line x1="92" y1="78" x2="92" y2="116"/>
    <line x1="120" y1="68" x2="120" y2="106"/>
    <line x1="150" y1="80" x2="150" y2="120"/>
    <line x1="178" y1="72" x2="178" y2="110"/>
    <line x1="208" y1="76" x2="208" y2="114"/>
  </g>
  <g fill="#8B4513" stroke="#5c2e0e" stroke-width="1.2">
    <circle cx="64" cy="118" r="10"/>
    <circle cx="92" cy="132" r="10"/>
    <circle cx="120" cy="120" r="10"/>
    <circle cx="150" cy="136" r="10"/>
    <circle cx="178" cy="124" r="10"/>
    <circle cx="208" cy="130" r="10"/>
    <circle cx="78" cy="160" r="10"/>
    <circle cx="108" cy="172" r="10"/>
    <circle cx="138" cy="162" r="10"/>
    <circle cx="166" cy="176" r="10"/>
    <circle cx="196" cy="166" r="10"/>
    <circle cx="94" cy="200" r="10"/>
    <circle cx="150" cy="206" r="10"/>
    <circle cx="180" cy="202" r="10"/>
  </g>

  <!-- 주인공(검정) : 피할 틈이 없음 -->
  <rect x="127" y="234" width="26" height="26" rx="4" fill="#171717" stroke="#000" stroke-width="1.5"/>

  <text x="140" y="290" text-anchor="middle" font-size="11" fill="#64748b">피했을 때만 빨라져야 하는데…</text>
</svg>
