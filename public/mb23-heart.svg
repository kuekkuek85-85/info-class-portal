<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 184" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <style>
    #big{animation:beatBig 2s linear infinite}
    #small{animation:beatSmall 2s linear infinite}
    @keyframes beatBig{0%,49.9%{opacity:1}50%,100%{opacity:0}}
    @keyframes beatSmall{0%,49.9%{opacity:0}50%,100%{opacity:1}}
    .on{fill:#ff5555}
  </style>
  <!-- 마이크로비트 보드 -->
  <rect x="6" y="6" width="132" height="132" rx="18" fill="#17171b"/>
  <!-- 꺼진 LED (바탕) -->
  <g fill="#3a1414">
    <circle cx="24" cy="24" r="7"/><circle cx="48" cy="24" r="7"/><circle cx="72" cy="24" r="7"/><circle cx="96" cy="24" r="7"/><circle cx="120" cy="24" r="7"/>
    <circle cx="24" cy="48" r="7"/><circle cx="48" cy="48" r="7"/><circle cx="72" cy="48" r="7"/><circle cx="96" cy="48" r="7"/><circle cx="120" cy="48" r="7"/>
    <circle cx="24" cy="72" r="7"/><circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="120" cy="72" r="7"/>
    <circle cx="24" cy="96" r="7"/><circle cx="48" cy="96" r="7"/><circle cx="72" cy="96" r="7"/><circle cx="96" cy="96" r="7"/><circle cx="120" cy="96" r="7"/>
    <circle cx="24" cy="120" r="7"/><circle cx="48" cy="120" r="7"/><circle cx="72" cy="120" r="7"/><circle cx="96" cy="120" r="7"/><circle cx="120" cy="120" r="7"/>
  </g>
  <!-- 큰 하트 (HEART) -->
  <g id="big" class="on">
    <circle cx="48" cy="24" r="7"/><circle cx="96" cy="24" r="7"/>
    <circle cx="24" cy="48" r="7"/><circle cx="48" cy="48" r="7"/><circle cx="72" cy="48" r="7"/><circle cx="96" cy="48" r="7"/><circle cx="120" cy="48" r="7"/>
    <circle cx="24" cy="72" r="7"/><circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="120" cy="72" r="7"/>
    <circle cx="48" cy="96" r="7"/><circle cx="72" cy="96" r="7"/><circle cx="96" cy="96" r="7"/>
    <circle cx="72" cy="120" r="7"/>
  </g>
  <!-- 작은 하트 (SMALL_HEART) -->
  <g id="small" class="on">
    <circle cx="48" cy="48" r="7"/><circle cx="96" cy="48" r="7"/>
    <circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/>
    <circle cx="72" cy="96" r="7"/>
  </g>
  <text x="72" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#171717">두근두근</text>
  <text x="72" y="177" text-anchor="middle" font-size="11" fill="#64748b">1초마다 큰 하트 ↔ 작은 하트</text>
</svg>
