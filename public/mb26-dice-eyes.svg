<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 184" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <style>
    .num{opacity:0;animation:show 4.2s linear infinite}
    @keyframes show{0%,14.7%{opacity:1}14.8%,100%{opacity:0}}
    #shaker{animation:shake 0.5s ease-in-out infinite}
    @keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-4px)}45%{transform:translateX(4px)}70%{transform:translateX(-3px)}100%{transform:translateX(0)}}
  </style>
  <g id="shaker">
    <rect x="6" y="6" width="132" height="132" rx="18" fill="#17171b"/>
    <g fill="#3a1414"><circle cx="24" cy="24" r="7"/><circle cx="48" cy="24" r="7"/><circle cx="72" cy="24" r="7"/><circle cx="96" cy="24" r="7"/><circle cx="120" cy="24" r="7"/><circle cx="24" cy="48" r="7"/><circle cx="48" cy="48" r="7"/><circle cx="72" cy="48" r="7"/><circle cx="96" cy="48" r="7"/><circle cx="120" cy="48" r="7"/><circle cx="24" cy="72" r="7"/><circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="120" cy="72" r="7"/><circle cx="24" cy="96" r="7"/><circle cx="48" cy="96" r="7"/><circle cx="72" cy="96" r="7"/><circle cx="96" cy="96" r="7"/><circle cx="120" cy="96" r="7"/><circle cx="24" cy="120" r="7"/><circle cx="48" cy="120" r="7"/><circle cx="72" cy="120" r="7"/><circle cx="96" cy="120" r="7"/><circle cx="120" cy="120" r="7"/></g>
    <g class="num" fill="#ff5a5a" style="animation-delay:0.00s"><circle cx="72" cy="72" r="7"/></g><g class="num" fill="#ff5a5a" style="animation-delay:0.70s"><circle cx="24" cy="24" r="7"/><circle cx="120" cy="120" r="7"/></g><g class="num" fill="#ff5a5a" style="animation-delay:1.40s"><circle cx="24" cy="24" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="120" cy="120" r="7"/></g><g class="num" fill="#ff5a5a" style="animation-delay:2.10s"><circle cx="24" cy="24" r="7"/><circle cx="120" cy="24" r="7"/><circle cx="24" cy="120" r="7"/><circle cx="120" cy="120" r="7"/></g><g class="num" fill="#ff5a5a" style="animation-delay:2.80s"><circle cx="24" cy="24" r="7"/><circle cx="120" cy="24" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="24" cy="120" r="7"/><circle cx="120" cy="120" r="7"/></g><g class="num" fill="#ff5a5a" style="animation-delay:3.50s"><circle cx="24" cy="24" r="7"/><circle cx="120" cy="24" r="7"/><circle cx="24" cy="72" r="7"/><circle cx="120" cy="72" r="7"/><circle cx="24" cy="120" r="7"/><circle cx="120" cy="120" r="7"/></g>
  </g>
  <text x="72" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#171717">흔들면 주사위 눈</text>
  <text x="72" y="177" text-anchor="middle" font-size="11" fill="#64748b">숫자 대신 점(눈)이 떠요</text>
</svg>
