<!doctype html>
<!--
  수업용 가짜 로그인 화면 — 디지털 윤리 「개인정보 보호 / 사이버 윤리」 (9·910차시 피싱 체험).

  이 파일은 피싱을 몸으로 겪어 보기 위한 교육용 소품이다. 진짜 네이버 로그인 화면을
  최대한 비슷하게 흉내 냈지만, **진짜 네이버가 아니다.** 학생이 아이디와 비밀번호를
  넣고 로그인을 누르면, 방금 친 것을 그대로 되돌려 보여주며 "가짜였다" 를 알린다.

  ## 아무것도 가져가지 않는다 (안전)

  여기에는 서버로 보내는 코드가 한 줄도 없다 — fetch 도, form action 도, 저장도 없다.
  바깥 리소스(네이버 CSS·이미지·폰트)도 전혀 불러오지 않는다. 로고·아이콘은 이 파일 안의
  글자와 인라인 SVG 로만 그렸다. 학생이 친 글자는 이 브라우저 밖으로 절대 나가지 않고,
  알림창을 띄운 뒤 그대로 사라진다. next.config 의 phish-demo CSP(default-src 'none')가
  이 파일의 바깥 통신을 서버 차원에서도 막는다.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>NAVER : 네이버</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
      "맑은 고딕", "돋움", dotum, sans-serif;
    background: #fff;
    color: #333;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 340px; margin: 0 auto; padding: 40px 16px 24px; }

  /* 로고 */
  .logo {
    text-align: center;
    margin: 8px 0 34px;
  }
  .logo span {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #03c75a;
  }

  /* 아이디·비밀번호 통 한 상자 (요즘 네이버 로그인 모양) */
  .box {
    border: 1.5px solid #dbdbdb;
    border-radius: 10px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    padding: 0 12px;
    height: 52px;
    background: #fff;
  }
  .row + .row { border-top: 1px solid #ececec; }
  .row .ico { width: 18px; height: 18px; flex: 0 0 18px; color: #b7b7b7; margin-right: 8px; }
  .row input {
    border: 0;
    outline: 0;
    flex: 1;
    height: 100%;
    font-size: 15px;
    background: transparent;
    color: #222;
  }
  .row input::placeholder { color: #a0a0a0; }
  .box:focus-within { border-color: #03c75a; }

  /* 토글 줄 */
  .opts {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 14px 2px 18px;
    font-size: 13px;
    color: #666;
  }
  .opt { display: inline-flex; align-items: center; gap: 7px; cursor: default; }
  .sw {
    width: 34px; height: 18px; border-radius: 10px; background: #d4d4d4;
    position: relative; transition: background .15s; flex: 0 0 34px;
  }
  .sw::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; transition: left .15s;
  }
  .sw.on { background: #03c75a; }
  .sw.on::after { left: 18px; }

  /* 로그인 버튼 */
  .btn {
    width: 100%;
    border: 0;
    border-radius: 6px;
    background: #03c75a;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    height: 52px;
    cursor: pointer;
  }
  .btn:active { background: #02b350; }

  /* 링크 */
  .links {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    color: #888;
    font-size: 13px;
  }
  .links span { cursor: default; }
  .links .bar { color: #e0e0e0; }

  /* 다른 방법 */
  .alt {
    display: flex;
    gap: 8px;
    margin-top: 22px;
  }
  .alt button {
    flex: 1;
    border: 1px solid #e0e0e0;
    background: #fff;
    border-radius: 6px;
    height: 44px;
    font-size: 13px;
    color: #555;
    cursor: default;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .foot {
    text-align: center;
    margin-top: 34px;
    color: #b7b7b7;
    font-size: 11px;
    line-height: 1.6;
  }
  .foot .lang {
    display: inline-block;
    border: 1px solid #e6e6e6;
    border-radius: 4px;
    padding: 3px 10px;
    color: #888;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span>NAVER</span></div>

    <form id="loginForm" autocomplete="off">
      <div class="box">
        <div class="row">
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="4" fill="currentColor"/>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="currentColor"/>
          </svg>
          <input id="id" type="text" aria-label="아이디 또는 전화번호" placeholder="아이디 또는 전화번호" maxlength="41" />
        </div>
        <div class="row">
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/>
            <path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
          <input id="pw" type="password" aria-label="비밀번호" placeholder="비밀번호" maxlength="16" />
        </div>
      </div>

      <div class="opts">
        <span class="opt"><span class="sw" id="swKeep"></span> 로그인 상태 유지</span>
        <span class="opt">IP보안 <span class="sw on"></span></span>
      </div>

      <button class="btn" type="submit">로그인</button>
    </form>

    <div class="links">
      <span>비밀번호 찾기</span><span class="bar">|</span>
      <span>아이디 찾기</span><span class="bar">|</span>
      <span>회원가입</span>
    </div>

    <div class="alt">
      <button type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/>
          <rect x="18" y="18" width="3" height="3"/>
        </svg>
        QR코드
      </button>
      <button type="button">일회용 번호</button>
      <button type="button">인증서</button>
    </div>

    <div class="foot">
      <span class="lang">한국어 ▾</span><br />
      Copyright © NAVER Corp. All Rights Reserved.
    </div>
  </div>

<script>
  // 「로그인 상태 유지」 토글은 눌리는 시늉만 (진짜 동작 없음)
  document.getElementById("swKeep").addEventListener("click", function () {
    this.classList.toggle("on");
  });

  // 로그인 누름 → 방금 친 것을 그대로 보여주고 끝. 어디로도 보내지 않는다.
  document.getElementById("loginForm").addEventListener("submit", function (event) {
    event.preventDefault();

    var id = document.getElementById("id").value.trim() || "(안 씀)";
    var pwField = document.getElementById("pw");
    var pw = pwField.value || "(안 씀)";

    alert(
      "당신의 아이디는 「" + id + "」\n" +
        "비밀번호는 「" + pw + "」 입니다.\n\n" +
        "해킹했습니다! 😈\n\n" +
        "— 이건 수업용 가짜 화면이에요.\n" +
        "진짜였다면 방금 그 비밀번호가 그대로 넘어갔습니다.\n" +
        "주소창을 봤나요?"
    );

    // 친 것을 화면에서도 바로 지운다 — 옆 사람이 어깨너머로 못 보게
    pwField.value = "";

    // 수업 화면(부모 창)에 "당했다" 를 알려, 무엇을 봤어야 했는지 펼쳐 준다.
    // 값은 안 보낸다 — 신호 한 마디뿐이다.
    if (window.parent && window.parent !== window) {
      window.parent.postMessage("phish-demo:submitted", "*");
    }
  });
</script>
</body>
</html>
