<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 216" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="26" y="22" width="132" height="132" rx="18" fill="#17171b"/>
  <g fill="#2a2a30"><circle cx="44" cy="40" r="7"/><circle cx="68" cy="40" r="7"/><circle cx="92" cy="40" r="7"/><circle cx="116" cy="40" r="7"/><circle cx="140" cy="40" r="7"/><circle cx="44" cy="64" r="7"/><circle cx="68" cy="64" r="7"/><circle cx="92" cy="64" r="7"/><circle cx="116" cy="64" r="7"/><circle cx="140" cy="64" r="7"/><circle cx="44" cy="88" r="7"/><circle cx="68" cy="88" r="7"/><circle cx="92" cy="88" r="7"/><circle cx="116" cy="88" r="7"/><circle cx="140" cy="88" r="7"/><circle cx="44" cy="112" r="7"/><circle cx="68" cy="112" r="7"/><circle cx="92" cy="112" r="7"/><circle cx="116" cy="112" r="7"/><circle cx="140" cy="112" r="7"/><circle cx="44" cy="136" r="7"/><circle cx="68" cy="136" r="7"/><circle cx="92" cy="136" r="7"/><circle cx="116" cy="136" r="7"/><circle cx="140" cy="136" r="7"/></g>

  <!-- 주인공(바닥, 빨강) : 충돌 전까지만 -->
  <circle cx="92" cy="136" r="7" fill="#ff6b6b">
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.42"/>
  </circle>

  <!-- 똥(노랑) : 떨어져 충돌 후 사라짐 -->
  <circle cx="92" cy="40" r="7" fill="#ffd43b">
    <animate attributeName="cy" dur="3s" repeatCount="indefinite" calcMode="discrete" values="40;64;88;112;136" keyTimes="0;0.1;0.2;0.3;0.4"/>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.42"/>
  </circle>

  <!-- 슬픈 얼굴 : 충돌 뒤 등장 → 점수 전에 사라짐 -->
  <g fill="#ffd43b">
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.44;0.66"/>
    <circle cx="68" cy="64" r="7"/><circle cx="116" cy="64" r="7"/>
    <circle cx="68" cy="136" r="7"/><circle cx="92" cy="112" r="7"/><circle cx="116" cy="136" r="7"/>
  </g>

  <!-- 점수 숫자 : 슬픈 얼굴 뒤에 등장 -->
  <g fill="#ffd43b">
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.7"/>
    <circle cx="68" cy="40" r="7"/><circle cx="92" cy="40" r="7"/><circle cx="116" cy="40" r="7"/>
    <circle cx="116" cy="64" r="7"/>
    <circle cx="68" cy="88" r="7"/><circle cx="92" cy="88" r="7"/><circle cx="116" cy="88" r="7"/>
    <circle cx="68" cy="112" r="7"/>
    <circle cx="68" cy="136" r="7"/><circle cx="92" cy="136" r="7"/><circle cx="116" cy="136" r="7"/>
  </g>

  <text x="92" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#171717">게임 끝에 점수를 숫자로</text>
  <text x="92" y="205" text-anchor="middle" font-size="11" fill="#64748b">충돌 → 슬픈 얼굴 → 점수가 떠요</text>
</svg>
