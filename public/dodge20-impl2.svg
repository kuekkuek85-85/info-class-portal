<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="140" y="22" text-anchor="middle" font-size="14" fill="#64748b">실행 결과 — 똥 3개가 동시에 내려옴</text>
  <rect x="40" y="30" width="200" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 똥(갈색) 3개 : 서로 다른 x 에서 동시에 떨어짐 (시작 시점만 조금 어긋나게) -->
  <circle cx="90" r="12" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5">
    <animate attributeName="cy" values="46;258" dur="1.8s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" r="12" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5">
    <animate attributeName="cy" values="46;258" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" r="12" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5">
    <animate attributeName="cy" values="46;258" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 주인공(검정) : 아래 가운데 고정 -->
  <rect x="127" y="232" width="26" height="26" rx="4" fill="#171717" stroke="#000" stroke-width="1.5"/>
</svg>
