<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 216" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <style>
    .axis{fill:#8a8f98;font-size:9px}
    .axlbl{fill:#64748b;font-size:9px;font-weight:700}
  </style>
  <rect x="26" y="22" width="132" height="132" rx="18" fill="#17171b"/>
  <g fill="#2a2a30"><circle cx="44" cy="40" r="7"/><circle cx="68" cy="40" r="7"/><circle cx="92" cy="40" r="7"/><circle cx="116" cy="40" r="7"/><circle cx="140" cy="40" r="7"/><circle cx="44" cy="64" r="7"/><circle cx="68" cy="64" r="7"/><circle cx="92" cy="64" r="7"/><circle cx="116" cy="64" r="7"/><circle cx="140" cy="64" r="7"/><circle cx="44" cy="88" r="7"/><circle cx="68" cy="88" r="7"/><circle cx="92" cy="88" r="7"/><circle cx="116" cy="88" r="7"/><circle cx="140" cy="88" r="7"/><circle cx="44" cy="112" r="7"/><circle cx="68" cy="112" r="7"/><circle cx="92" cy="112" r="7"/><circle cx="116" cy="112" r="7"/><circle cx="140" cy="112" r="7"/><circle cx="44" cy="136" r="7"/><circle cx="68" cy="136" r="7"/><circle cx="92" cy="136" r="7"/><circle cx="116" cy="136" r="7"/><circle cx="140" cy="136" r="7"/></g>
  <g class="axis" text-anchor="middle">
    <text x="15" y="43">0</text><text x="15" y="67">1</text><text x="15" y="91">2</text><text x="15" y="115">3</text><text x="15" y="139">4</text>
    <text x="44" y="171">0</text><text x="68" y="171">1</text><text x="92" y="171">2</text><text x="116" y="171">3</text><text x="140" y="171">4</text>
  </g>
  <text class="axlbl" x="15" y="29" text-anchor="middle">y</text>
  <text class="axlbl" x="160" y="171">x</text>
  <circle cx="92" cy="136" r="7" fill="#ff5a5a"/>
  <!-- 똥: 두 열(x=1 cx68, x=3 cx116)에서 번갈아 떨어져 무작위처럼 보인다.
       cy 는 1.8s 마다 맨 위(40)→바닥 아래(160)로, cx 는 3.6s(두 사이클) 동안 68→116 로 한 번씩 바뀐다(discrete). -->
  <circle r="7" fill="#b8860b">
    <animate attributeName="cy" values="40;160" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="68;116" keyTimes="0;0.5" dur="3.6s" calcMode="discrete" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#171717">바닥에 닿으면 다시 위로</text>
  <text x="92" y="211" text-anchor="middle" font-size="11" fill="#64748b">다른 칸에서 계속 떨어져요</text>
</svg>
