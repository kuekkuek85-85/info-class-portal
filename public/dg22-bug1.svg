<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="140" y="22" text-anchor="middle" font-size="14" fill="#64748b">증상 — 빨간 에러, 게임 창이 안 떠요</text>
  <!-- 콘솔(출력) 화면 -->
  <rect x="24" y="34" width="232" height="236" rx="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="66" font-size="11" fill="#94a3b8" font-family="monospace">&gt; python dodge.py</text>
  <!-- 에러 코드 줄 표시 -->
  <text x="40" y="100" font-size="10.5" fill="#e2e8f0" font-family="monospace">  File "dodge.py", line 21</text>
  <text x="40" y="118" font-size="10.5" fill="#e2e8f0" font-family="monospace">    if over = True:</text>
  <text x="40" y="132" font-size="12" fill="#f87171" font-family="monospace">            ^</text>
  <!-- 빨간 에러 메시지 -->
  <rect x="34" y="150" width="212" height="54" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="48" y="172" font-size="11.5" fill="#fecaca" font-family="monospace" font-weight="700">SyntaxError:</text>
  <text x="48" y="190" font-size="11.5" fill="#fecaca" font-family="monospace">invalid syntax</text>
  <text x="140" y="238" text-anchor="middle" font-size="12" fill="#94a3b8">게임 창이 열리지 않았어요</text>
  <text x="140" y="256" text-anchor="middle" font-size="11" fill="#64748b">(빨간 글씨의 줄 번호부터 읽어 봐요)</text>
</svg>
