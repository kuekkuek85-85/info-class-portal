<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="140" y="22" text-anchor="middle" font-size="14" fill="#64748b">증상 — 시작하자마자 GAME OVER</text>
  <rect x="40" y="30" width="200" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 점수: 아직 0 -->
  <text x="140" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#171717">Score: 0</text>

  <!-- 똥(갈색) 여러 개 : 아직 저 위에 멀리 있음 -->
  <circle cx="92" cy="92" r="12" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>
  <circle cx="176" cy="100" r="12" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>
  <circle cx="132" cy="84" r="12" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>

  <!-- 벌써 뜬 게임 오버 글씨 -->
  <text x="140" y="178" text-anchor="middle" font-size="22" font-weight="800" fill="#dc2626">GAME OVER!</text>

  <!-- 주인공(검정) : 아래 가운데, 똥과 닿지도 않았는데 -->
  <rect x="127" y="232" width="26" height="26" rx="4" fill="#171717" stroke="#000" stroke-width="1.5"/>

  <text x="140" y="290" text-anchor="middle" font-size="11" fill="#64748b">똥은 멀리 있는데 왜 벌써 끝났을까요?</text>
</svg>
