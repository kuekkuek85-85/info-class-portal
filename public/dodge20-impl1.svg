<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="140" y="22" text-anchor="middle" font-size="14" fill="#64748b">실행 결과 — 똥 3개가 맨 위에 나란히 생김</text>
  <rect x="40" y="30" width="200" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 똥(갈색) 3개 : y는 200 고정(화면 맨 위 한 줄), x만 서로 다름. 정적 — 아직 안 떨어짐 -->
  <circle cx="82" cy="58" r="12" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>
  <circle cx="140" cy="58" r="12" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>
  <circle cx="198" cy="58" r="12" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>

  <!-- 주인공(검정) : 아래 가운데 고정 -->
  <rect x="127" y="232" width="26" height="26" rx="4" fill="#171717" stroke="#000" stroke-width="1.5"/>
</svg>
