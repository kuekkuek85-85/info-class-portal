<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- 왼쪽 : 변수 3개를 따로따로 (상자 3개) -->
  <text x="140" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">변수 3개 — 따로따로</text>

  <!-- poop1 -->
  <rect x="30" y="48" width="100" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="66" text-anchor="middle" font-size="12" fill="#64748b">poop1</text>
  <circle cx="80" cy="88" r="11" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>

  <!-- poop2 -->
  <rect x="30" y="118" width="100" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="136" text-anchor="middle" font-size="12" fill="#64748b">poop2</text>
  <circle cx="80" cy="158" r="11" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>

  <!-- poop3 -->
  <rect x="30" y="188" width="100" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="206" text-anchor="middle" font-size="12" fill="#64748b">poop3</text>
  <circle cx="80" cy="228" r="11" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>

  <text x="140" y="276" text-anchor="middle" font-size="12" fill="#94a3b8">이름이 셋 — 하나씩 따로 다뤄야 해요</text>

  <!-- 가운데 vs -->
  <text x="280" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="#94a3b8">vs</text>

  <!-- 오른쪽 : 리스트 1개 (한 상자 안에 3칸) -->
  <text x="415" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">리스트 1개 — 한 상자</text>

  <rect x="330" y="48" width="200" height="198" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="430" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">poops</text>

  <!-- 칸 0 -->
  <rect x="348" y="84" width="164" height="46" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="362" y="112" font-size="11" fill="#94a3b8">[0]</text>
  <circle cx="430" cy="107" r="11" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>

  <!-- 칸 1 -->
  <rect x="348" y="138" width="164" height="46" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="362" y="166" font-size="11" fill="#94a3b8">[1]</text>
  <circle cx="430" cy="161" r="11" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>

  <!-- 칸 2 -->
  <rect x="348" y="192" width="164" height="46" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="362" y="220" font-size="11" fill="#94a3b8">[2]</text>
  <circle cx="430" cy="215" r="11" fill="#8B4513" stroke="#5c2e0e" stroke-width="1.5"/>

  <text x="430" y="276" text-anchor="middle" font-size="12" fill="#6366f1">이름은 하나 — for 로 한꺼번에 다뤄요</text>
</svg>
