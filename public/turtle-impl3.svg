<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="140" y="22" text-anchor="middle" font-size="14" fill="#64748b">실행 결과 — 왼쪽·오른쪽으로 이동</text>
  <rect x="40" y="30" width="200" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 주인공(검정) : 오른쪽으로 갔다(0~0.5) 왼쪽으로(0.5~1) 반복 -->
  <rect x="70" y="232" width="26" height="26" rx="4" fill="#171717" stroke="#000" stroke-width="1.5">
    <animate attributeName="x" values="70;184;70" keyTimes="0;0.5;1" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- ← 키 : 왼쪽으로 가는 동안(0.5~1) 눌림 -->
  <rect x="78" y="303" width="40" height="34" rx="7" fill="#94a3b8"/>
  <g>
    <rect x="78" y="300" width="40" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
      <animate attributeName="fill" values="#f1f5f9;#f1f5f9;#fbbf24;#fbbf24" keyTimes="0;0.5;0.52;1" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="98" y="324" text-anchor="middle" font-size="22" fill="#334155">←</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 3;0 3" keyTimes="0;0.5;0.52;1" dur="3.4s" repeatCount="indefinite"/>
  </g>

  <!-- → 키 : 오른쪽으로 가는 동안(0~0.5) 눌림 -->
  <rect x="162" y="303" width="40" height="34" rx="7" fill="#94a3b8"/>
  <g>
    <rect x="162" y="300" width="40" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
      <animate attributeName="fill" values="#fbbf24;#fbbf24;#f1f5f9;#f1f5f9" keyTimes="0;0.48;0.5;1" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="182" y="324" text-anchor="middle" font-size="22" fill="#334155">→</text>
    <animateTransform attributeName="transform" type="translate" values="0 3;0 3;0 0;0 0" keyTimes="0;0.48;0.5;1" dur="3.4s" repeatCount="indefinite"/>
  </g>
</svg>
