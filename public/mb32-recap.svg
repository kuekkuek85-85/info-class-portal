<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- 32차 총정리: 지금까지 만든 작품의 입력 → 처리 → 출력 (센서 → 프로세서 → 액추에이터) -->
  <rect x="4" y="4" width="712" height="40" rx="8" fill="#23251d"/>
  <text x="87" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">작품</text>
  <text x="257" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">입력</text>
  <text x="257" y="39" text-anchor="middle" font-size="11" fill="#d3d6cb">센서</text>
  <text x="440" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">처리</text>
  <text x="440" y="39" text-anchor="middle" font-size="11" fill="#d3d6cb">프로세서</text>
  <text x="624" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">출력</text>
  <text x="624" y="39" text-anchor="middle" font-size="11" fill="#d3d6cb">액추에이터</text>

  <!-- 열 바탕 -->
  <rect x="172" y="50" width="170" height="282" rx="6" fill="#dceaf6"/>
  <rect x="348" y="50" width="184" height="282" rx="6" fill="#e7d8ee"/>
  <rect x="538" y="50" width="178" height="282" rx="6" fill="#f7d6d3"/>

  <!-- 줄 구분선 -->
  <g stroke="#ffffff" stroke-width="3">
    <line x1="4" y1="106" x2="716" y2="106"/><line x1="4" y1="162" x2="716" y2="162"/>
    <line x1="4" y1="218" x2="716" y2="218"/><line x1="4" y1="274" x2="716" y2="274"/>
  </g>

  <g font-size="14" fill="#23251d" text-anchor="middle">
    <!-- 1 하트 -->
    <text x="87" y="76" font-weight="700">하트 두근두근</text><text x="87" y="94" font-size="11" fill="#63655b">23차</text>
    <text x="257" y="84">없음 (켜면 시작)</text>
    <text x="440" y="84">반복 + 잠깐 쉬기</text>
    <text x="624" y="84">LED 하트 크게·작게</text>
    <!-- 2 만보기 -->
    <text x="87" y="132" font-weight="700">만보기</text><text x="87" y="150" font-size="11" fill="#63655b">25차</text>
    <text x="257" y="140">흔들기 (가속도)</text>
    <text x="440" y="140">걸음 수 +1</text>
    <text x="624" y="140">LED 숫자</text>
    <!-- 3 주사위 -->
    <text x="87" y="188" font-weight="700">주사위</text><text x="87" y="206" font-size="11" fill="#63655b">26차</text>
    <text x="257" y="196">흔들기 (가속도)</text>
    <text x="440" y="196">1~6 무작위 + 갈림길</text>
    <text x="624" y="196">LED 주사위 눈</text>
    <!-- 4 가위바위보 -->
    <text x="87" y="244" font-weight="700">가위바위보</text><text x="87" y="262" font-size="11" fill="#63655b">27차</text>
    <text x="257" y="252">버튼 A·B, 로고 터치</text>
    <text x="440" y="252">무작위 + 승패 판정</text>
    <text x="624" y="252">LED 그림·표정</text>
    <!-- 5 똥피하기 -->
    <text x="87" y="300" font-weight="700">똥피하기</text><text x="87" y="318" font-size="11" fill="#63655b">28~32차</text>
    <text x="257" y="308">버튼 A·B</text>
    <text x="440" y="308">반복·충돌·점수·리스트</text>
    <text x="624" y="308">LED 점·표정·점수</text>
  </g>
</svg>
