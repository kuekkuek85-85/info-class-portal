<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 게임 화면(가로 400 · 세로 500)을 나타내는 테두리 -->
  <rect x="160" y="90" width="320" height="400" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="160" y="80" font-size="13" fill="#94a3b8">게임 화면 (가로 400 · 세로 500)</text>

  <!-- 눈금선 (100칸마다) -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="240" y1="90" x2="240" y2="490"/>
    <line x1="400" y1="90" x2="400" y2="490"/>
    <line x1="160" y1="130" x2="480" y2="130"/>
    <line x1="160" y1="210" x2="480" y2="210"/>
    <line x1="160" y1="370" x2="480" y2="370"/>
    <line x1="160" y1="450" x2="480" y2="450"/>
  </g>

  <!-- x축 · y축 (양끝 화살표) -->
  <line x1="110" y1="290" x2="530" y2="290" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="320" y1="55" x2="320" y2="525" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- 눈금 숫자 -->
  <g font-size="11" fill="#94a3b8">
    <text x="160" y="307" text-anchor="middle">−200</text>
    <text x="240" y="307" text-anchor="middle">−100</text>
    <text x="400" y="307" text-anchor="middle">100</text>
    <text x="480" y="307" text-anchor="middle">200</text>
    <text x="310" y="134" text-anchor="end">200</text>
    <text x="310" y="214" text-anchor="end">100</text>
    <text x="310" y="374" text-anchor="end">−100</text>
    <text x="310" y="454" text-anchor="end">−200</text>
  </g>

  <!-- 방향 설명 -->
  <g font-size="15" font-weight="600" fill="#1e293b">
    <text x="502" y="283" text-anchor="middle">x 커짐 (+)</text>
    <text x="140" y="283" text-anchor="middle">x 작아짐 (−)</text>
    <text x="338" y="70">y 커짐 (+)</text>
    <text x="338" y="514">y 작아짐 (−)</text>
  </g>

  <!-- 가운데 (0,0) -->
  <circle cx="320" cy="290" r="4" fill="#334155"/>
  <text x="331" y="283" font-size="13" fill="#334155">(0, 0) 가운데</text>

  <!-- 주인공을 좌표평면에 (0, −200) 에 놓는다 (코드의 goto(0,-200)) -->
  <rect x="305" y="435" width="30" height="30" rx="4" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
  <text x="347" y="452" font-size="14" font-weight="600" fill="#9a3412">주인공</text>
  <text x="347" y="470" font-size="13" fill="#9a3412">(0, −200)</text>
</svg>
