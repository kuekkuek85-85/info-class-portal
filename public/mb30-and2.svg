  <text x="92" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#171717">똥은 맨 아랫줄, 주인공과 다른 칸</text>
  <text x="92" y="200" text-anchor="middle" font-size="11" fill="#64748b">노랑 = 똥 · 빨강 = 주인공</text>
