<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 184" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <style>
    .num{opacity:0;animation:show 5.5s linear infinite}
    @keyframes show{0%,7%{opacity:1}8%,100%{opacity:0}}
  </style>
  <!-- 마이크로비트 보드 -->
  <rect x="6" y="6" width="132" height="132" rx="18" fill="#17171b"/>
  <!-- 흔들 때마다 +1 : 0 → 10 (show_number(steps)) -->
  <g text-anchor="middle" font-size="62" font-weight="800" fill="#ff5a5a">
    <text class="num" x="72" y="94" style="animation-delay:0s">0</text>
    <text class="num" x="72" y="94" style="animation-delay:0.5s">1</text>
    <text class="num" x="72" y="94" style="animation-delay:1s">2</text>
    <text class="num" x="72" y="94" style="animation-delay:1.5s">3</text>
    <text class="num" x="72" y="94" style="animation-delay:2s">4</text>
    <text class="num" x="72" y="94" style="animation-delay:2.5s">5</text>
    <text class="num" x="72" y="94" style="animation-delay:3s">6</text>
    <text class="num" x="72" y="94" style="animation-delay:3.5s">7</text>
    <text class="num" x="72" y="94" style="animation-delay:4s">8</text>
    <text class="num" x="72" y="94" style="animation-delay:4.5s">9</text>
    <text class="num" x="72" y="94" font-size="52" style="animation-delay:5s">10</text>
  </g>
  <text x="72" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#171717">흔들 때마다 +1</text>
  <text x="72" y="177" text-anchor="middle" font-size="11" fill="#64748b">0 → 10 으로 올라가요</text>
</svg>
