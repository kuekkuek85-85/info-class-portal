  <text x="72" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#171717">흔들 때마다 +1</text>
  <text x="72" y="177" text-anchor="middle" font-size="11" fill="#64748b">0 → 10 으로 올라가요</text>
