24" r="7"/><circle cx="72" cy="24" r="7"/><circle cx="96" cy="24" r="7"/><circle cx="48" cy="48" r="7"/><circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="96" cy="96" r="7"/><circle cx="48" cy="120" r="7"/><circle cx="72" cy="120" r="7"/><circle cx="96" cy="120" r="7"/></g><g class="num" fill="#ff5a5a" style="animation-delay:3.00s"><circle cx="48" cy="24" r="7"/><circle cx="72" cy="24" r="7"/><circle cx="96" cy="24" r="7"/><circle cx="48" cy="48" r="7"/><circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="48" cy="96" r="7"/><circle cx="96" cy="96" r="7"/><circle cx="48" cy="120" r="7"/><circle cx="72" cy="120" r="7"/><circle cx="96" cy="120" r="7"/></g><g class="num" fill="#ff5a5a" style="animation-delay:3.50s"><circle cx="48" cy="24" r="7"/><circle cx="72" cy="24" r="7"/><circle cx="96" cy="24" r="7"/><circle cx="96" cy="48" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="96" cy="96" r="7"/><circle cx="96" cy="120" r="7"/></g><g class="num" fill="#ff5a5a" style="animation-delay:4.00s"><circle cx="48" cy="24" r="7"/><circle cx="72" cy="24" r="7"/><circle cx="96" cy="24" r="7"/><circle cx="48" cy="48" r="7"/><circle cx="96" cy="48" r="7"/><circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="48" cy="96" r="7"/><circle cx="96" cy="96" r="7"/><circle cx="48" cy="120" r="7"/><circle cx="72" cy="120" r="7"/><circle cx="96" cy="120" r="7"/></g><g class="num" fill="#ff5a5a" style="animation-delay:4.50s"><circle cx="48" cy="24" r="7"/><circle cx="72" cy="24" r="7"/><circle cx="96" cy="24" r="7"/><circle cx="48" cy="48" r="7"/><circle cx="96" cy="48" r="7"/><circle cx="48" cy="72" r="7"/><circle cx="72" cy="72" r="7"/><circle cx="96" cy="72" r="7"/><circle cx="96" cy="96" r="7"/><circle cx="48" cy="120" r="7"/><circle cx="72" cy="120" r="7"/><circle cx="96" cy="120" r="7"/></g>
